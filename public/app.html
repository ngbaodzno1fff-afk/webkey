<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NGBAO FF VIP Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Nền Đen Huyền Bí Chuẩn Esports (Pure Black & Subtle Radial Glow) -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="radial-ambient-glow"></div>
  </div>

  <!-- Thông báo Toast góc trên bên phải -->
  <div class="bg-toast" id="bgToast" role="status" aria-live="polite">
    <div class="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="toast-text">
      <span class="toast-title" id="toastTitle">Đang chạy dưới nền</span>
      <span class="toast-sub" id="toastSub">Holo HUD Active</span>
    </div>
  </div>

  <!-- Nút quản lý Key bản quyền góc trên bên trái -->
  <header class="top-nav-bar">
    <button type="button" class="btn-key-status" id="btnOpenKeyModal" title="Xem/Đổi License Key">
      <span class="key-status-dot"></span>
      <span class="key-status-text" id="topKeyStatusText">KEY VIP: ACTIVE</span>
    </button>
    <div class="server-badge">SERVER 6.1.0</div>
  </header>

  <!-- ================= LỚP HUD Ở TRUNG TÂM (HOLO HUD, TÂM ẢO & VÒNG FOV) ================= -->
  <div class="holo-hud-viewport" id="holoHudViewport">
    
    <!-- Tiêu đề Holo HUD ở đỉnh vòng tròn -->
    <div class="holo-hud-label" id="holoHudLabel">Holo HUD</div>

    <!-- Nhãn chữ "Tâm ảo" nằm bên trái tâm ngắm -->
    <div class="hud-label-tam-ao" id="hudLabelTamAo">Tâm ảo</div>

    <!-- Tâm Ngắm Chữ Thập Neon Đỏ (Tâm ảo) -->
    <div class="hud-reticle-crosshair" id="hudCrosshair">
      <div class="reticle-arm-h"></div>
      <div class="reticle-arm-v"></div>
      <div class="reticle-dot"></div>
    </div>

    <!-- Nhãn chữ "Vòng FOV" nằm góc dưới bên trái vòng tròn -->
    <div class="hud-label-vong-fov" id="hudLabelVongFov">Vòng FOV</div>

    <!-- Vòng tròn ngắm FOV căn giữa màn hình (kéo chỉnh to/nhỏ bằng thanh trượt) -->
    <div class="hud-fov-circle-ring" id="hudFovCircle"></div>

  </div>

  <!-- ================= BẢNG ĐIỀU KHIỂN VIP PANEL (KHỚP 100% DESIGN MOCKUP) ================= -->
  <div class="vip-panel-wrapper" id="vipPanelWrapper">

    <!-- Avatar tròn phát sáng neon đỏ nằm góc trên bên phải VIP Panel -->
    <div class="avatar-badge-wrap" id="floatingBall" title="Chạm để Thu nhỏ / Mở rộng VIP PANEL">
      <div class="avatar-neon-ring"></div>
      <img src="avatar.jpg" alt="Avatar NGBAO FF" class="avatar-badge-img" id="avatarBadgeImg" />
    </div>

    <!-- Hộp Menu VIP PANEL -->
    <aside class="vip-panel-card" id="vipPanelCard">

      <!-- Header dạng viên thuốc đỏ neon: VIP PANEL -->
      <div class="vip-capsule-header">
        <span class="vip-capsule-title">VIP PANEL</span>
      </div>

      <!-- Danh sách các chức năng chính -->
      <div class="vip-func-list">

        <!-- 1. Aimlock -->
        <div class="vip-func-row">
          <span class="func-title">Aimlock</span>
          <label class="toggle-pill">
            <input type="checkbox" id="chkAimlock" checked />
            <span class="toggle-track">
              <span class="toggle-state-text">ON</span>
            </span>
          </label>
        </div>

        <!-- 2. Aimbot -->
        <div class="vip-func-row">
          <span class="func-title">Aimbot</span>
          <label class="toggle-pill">
            <input type="checkbox" id="chkAimbot" checked />
            <span class="toggle-track">
              <span class="toggle-state-text">ON</span>
            </span>
          </label>
        </div>

        <!-- 3. Aimhead -->
        <div class="vip-func-row">
          <span class="func-title">Aimhead</span>
          <label class="toggle-pill">
            <input type="checkbox" id="chkAimhead" checked />
            <span class="toggle-track">
              <span class="toggle-state-text">ON</span>
            </span>
          </label>
        </div>

        <!-- 4. Tâm Ảo -->
        <div class="vip-func-row">
          <span class="func-title">Tâm Ảo</span>
          <label class="toggle-pill">
            <input type="checkbox" id="chkCrosshair" checked />
            <span class="toggle-track">
              <span class="toggle-state-text">ON</span>
            </span>
          </label>
        </div>

        <!-- 5. Vòng FOV -->
        <div class="vip-func-row">
          <span class="func-title">Vòng FOV</span>
          <label class="toggle-pill">
            <input type="checkbox" id="chkFov" checked />
            <span class="toggle-track">
              <span class="toggle-state-text">ON</span>
            </span>
          </label>
        </div>

        <!-- 6. Kích Thước FOV (Thanh trượt mượt mà) -->
        <div class="vip-slider-block">
          <div class="slider-title-row">
            <span>Kích Thước FOV: <strong id="valFovSize">140px</strong></span>
          </div>
          <div class="range-wrap">
            <input type="range" min="60" max="320" value="140" class="neon-range" id="rangeFovSize" />
          </div>
        </div>

        <!-- 7. Nhạc Nền MP3 (Loop) -->
        <div class="vip-music-block">
          <div class="music-left-meta">
            <span class="music-txt-main">Nhạc Nền</span>
            <span class="music-txt-sub">MP3 (Loop)</span>
          </div>
          <div class="music-right-action">
            <button type="button" class="btn-pill-picker" id="btnPickMusic">
              Chọn File MP3 (Downloads)
            </button>
            <label class="toggle-pill-mini">
              <input type="checkbox" id="chkMusic" checked />
              <span class="toggle-track">
                <span class="toggle-state-text">ON</span>
              </span>
            </label>
          </div>
        </div>

        <!-- 8. Nút Khởi Chạy Nhanh Game Free Fire -->
        <div class="vip-launch-buttons">
          <button type="button" class="btn-game-red" id="btnLaunchFF">
            Vào FF Thường
          </button>
          <button type="button" class="btn-game-outline" id="btnLaunchFFMax">
            Vào FF MAX
          </button>
        </div>

      </div>

    </aside>

  </div>

  <!-- ================= MODAL QUẢN LÝ / NHẬP KEY (KHÔNG LÀM HỎNG GIAO DIỆN) ================= -->
  <div class="key-auth-modal" id="keyAuthModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-avatar">
        <img src="avatar.jpg" alt="Avatar" />
      </div>
      <h3 class="modal-title">XÁC THỰC LICENSE KEY</h3>
      <p class="modal-desc">Nhập Key kích hoạt VIP để kết nối hệ thống Server 6.1.0</p>
      
      <div class="modal-input-wrap">
        <input type="text" id="modalKeyInput" class="modal-input" placeholder="Nhập mã Key tại đây..." spellcheck="false" />
        <button type="button" class="btn-modal-paste" id="btnModalPaste">Dán</button>
      </div>

      <p class="modal-error" id="modalErrorMsg"></p>

      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" id="btnModalClose">Đóng</button>
        <button type="button" class="btn-modal-submit" id="btnModalVerify">Kích Hoạt Ngay</button>
      </div>
    </div>
  </div>

  <!-- Audio Player phát nhạc lặp lại -->
  <audio id="bgmAudio" loop preload="auto" src="music.mp3"></audio>
  <input type="file" id="bgmFileInput" accept="audio/*" style="display: none;" />

  <script src="app.js"></script>
</body>
</html>
